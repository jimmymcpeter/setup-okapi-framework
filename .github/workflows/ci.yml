name: Continuous Integration

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  SETUP_NODE_VERSION: '24.x'
  SETUP_OKAPI_VERSION: '1.47.0'

jobs:
  test-action-ubuntu:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.SETUP_NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm packages
        run: npm ci

      - name: Test setup-okapi-framework
        id: test-action-latest
        uses: ./
        with:
          version: ${{ env.SETUP_OKAPI_VERSION }}

      - name: Print output
        run: |
          echo "Installed Okapi to ${{ steps.test-action-latest.outputs.path }}"

      - name: Check Java version
        run: |
          echo "JAVA_HOME is set to: $JAVA_HOME"
          java -version

      - name: Run Tikal
        run: |
          tikal.sh -i

  test-action-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.SETUP_NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm packages
        run: npm ci

      - name: Test setup-okapi-framework
        id: test-action-latest
        uses: ./
        with:
          version: ${{ env.SETUP_OKAPI_VERSION }}

      - name: Print output
        run: |
          echo "Installed Okapi to ${{ steps.test-action-latest.outputs.path }}"

      - name: Setup Java 11
        # windows-2022 uses Java 8 as the default, and Okapi requires Java 11
        # Using `echo "JAVA_HOME=$Env:JAVA_HOME_11_X64" >> $Env:GITHUB_ENV` will not work
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Check Java version
        run: |
          echo "JAVA_HOME is set to: $Env:JAVA_HOME"
          java -version

      - name: Run Tikal
        run: |
          tikal.bat -i
